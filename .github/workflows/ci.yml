name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  push-safety:
    name: Push safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate outgoing commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi

          printf 'refs/heads/ci %s refs/heads/base %s\n' "$PUSH_HEAD_SHA" "$base_sha" \
            | .githooks/pre-push origin

  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flutter and Go come from mise.toml.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - name: Phone app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Shared package
        working-directory: packages/obs_pad_companion
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Signing key tool
        working-directory: tool/signing-key
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Desktop app
        working-directory: companion
        run: |
          flutter pub get
          flutter analyze
          flutter test

  real-obs:
    name: Tests against a real OBS (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flutter and Go come from mise.toml.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build OBS Pad Desktop (runs next to OBS in the container)
        working-directory: companion
        run: flutter build linux --release
      - run: flutter pub get
      - run: tool/obs-docker/run-tests.sh
        env:
          KEEP: 1
      - name: OBS and desktop app logs
        if: failure()
        run: |
          docker logs obspad-obs 2>&1 | tail -200 || true
          docker exec obspad-obs cat /tmp/obs-pad-desktop.log || true
