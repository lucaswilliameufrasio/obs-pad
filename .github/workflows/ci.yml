name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Phone app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Shared package
        working-directory: packages/obs_pad_companion
        run: |
          dart pub get
          dart analyze
          dart test
      - uses: actions/setup-go@v5
        with:
          go-version-file: tool/signing-key/go.mod
      - name: Signing key tool
        working-directory: tool/signing-key
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Desktop app
        working-directory: companion
        run: |
          flutter pub get
          flutter analyze
          flutter test

  real-obs:
    name: Tests against a real OBS (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build OBS Pad Desktop (runs next to OBS in the container)
        working-directory: companion
        run: flutter build linux --release
      - run: flutter pub get
      - run: tool/obs-docker/run-tests.sh
        env:
          KEEP: 1
      - name: OBS and desktop app logs
        if: failure()
        run: |
          docker logs obspad-obs 2>&1 | tail -200 || true
          docker exec obspad-obs cat /tmp/obs-pad-desktop.log || true
