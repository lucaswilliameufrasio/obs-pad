name: Build apps

# Manual run: builds everything and keeps the files as workflow artifacts.
# Pushing a tag like v1.0.0: also attaches them to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk obs-pad-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: obs-pad-android
          path: obs-pad-android.apk

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../obs-pad-desktop-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: obs-pad-desktop-windows
          path: obs-pad-desktop-windows.zip

  desktop-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/OBS Pad Desktop.app" ../obs-pad-desktop-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: obs-pad-desktop-macos
          path: obs-pad-desktop-macos.zip

  desktop-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter build linux --release
      - run: tar -czf ../obs-pad-desktop-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: obs-pad-desktop-linux
          path: obs-pad-desktop-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-pad-android.apk
            obs-pad-desktop-windows.zip
            obs-pad-desktop-macos.zip
            obs-pad-desktop-linux.tar.gz
