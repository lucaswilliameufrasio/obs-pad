# Local RTMP "platform" that accepts and discards the live.
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;
daemon on;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log;
events {}
http { access_log off; }
rtmp {
  server {
    listen 1935;
    application live {
      live on;
      record off;
    }
  }
}
